name: mirror
# Mirrors main and release tags to the private repo that Claude's
# organization marketplace syncs from. Uses secret MIRROR_DEPLOY_KEY, the
# private half of a write deploy key on Gradient-AO/gradient-cio-marketplace.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mirror
  cancel-in-progress: false
jobs:
  mirror:
    if: github.repository == 'Gradient-AO/claude-plugin'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Push main and tags to private mirror
        env: { MIRROR_DEPLOY_KEY: "${{ secrets.MIRROR_DEPLOY_KEY }}" }
        run: |
          mkdir -p ~/.ssh
          echo "$MIRROR_DEPLOY_KEY" > ~/.ssh/mirror_key
          chmod 600 ~/.ssh/mirror_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/mirror_key -o IdentitiesOnly=yes"
          git fetch --tags --force origin
          git push --force git@github.com:Gradient-AO/gradient-cio-marketplace.git \
            "refs/remotes/origin/main:refs/heads/main" "refs/tags/v*:refs/tags/v*"
