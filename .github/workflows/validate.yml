name: validate
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Quick checks (same as the pre-push hook)
        run: python plugins/gradient-cio/tools/quick_checks.py
      - name: Install system renderers
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-inter libreoffice poppler-utils qpdf
      - name: Install pinned Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r plugins/gradient-cio/requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Tests
        env:
          REQUIRE_INTER_PDF: "1"
          REQUIRE_LIBREOFFICE: "1"
        run: python plugins/gradient-cio/tests/run_tests.py
      - name: Every example renders
        run: |
          set -euo pipefail
          python plugins/gradient-cio/tools/generate_examples.py \
            --format both --out /tmp/gradient-examples
          for report in /tmp/gradient-examples/*.pdf; do
            python plugins/gradient-cio/shared/check_layout.py "$report" \
              --min-fill 0.40 --exclude 1 \
              || echo "::warning file=$report::example layout below the 40% page-fill guide"
          done
      - name: Upload generated examples after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generated-examples
          path: /tmp/gradient-examples
          retention-days: 3
