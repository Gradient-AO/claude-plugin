name: validate
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install renderer
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils qpdf
          pip install playwright && python -m playwright install --with-deps chromium
      - name: Version check
        run: |
          python - <<'PY'
          import json
          p = json.load(open("plugins/gradient-cio/.claude-plugin/plugin.json"))["version"]
          m = [x for x in json.load(open(".claude-plugin/marketplace.json"))["plugins"] if x["name"] == "gradient-cio"][0]["version"]
          assert p == m, f"plugin.json {p} != marketplace.json {m}"
          print("version", p)
          PY
      - name: Tests
        run: python plugins/gradient-cio/tests/run_tests.py
